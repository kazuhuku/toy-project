    <h1 class="title">個人情報入力フォーム</h1>
    <section id="form-blk">
        <div class="inner">
            <form method="post" action="" id="form" class="h-adr">
                <span class="p-country-name" style="display:none;">Japan</span>
                <div id="contact_form">
                    <div class="box">
                        <label>お名前<sapn class="warning"></sapn></label><br>
                        <input type="text" name="username" title="お名前を入力してください。（例 山田 太郎）">
                    </div>

                    <div class="box">
                        <label>電話番号<span class="warning"></span></label><br>
                        <input type="tel" name="phone" maxlength="11" title="半角数字で入力してください">
                    </div>

                    <div class="box">
                        <label>メールアドレス<span class="warning"></span></label><br>
                        <input type="text" name="email" title="半角英数字で入力してください">
                    </div>


                    <div class="box">
                        <label>〒郵便番号<sapn class="warning"></span></label><br>
                        <input type="text" name="postnumber" class="p-postal-code" maxlength="7"
                            title="ハイフンを除く半角数字で番号を入れてください。">
                    </div>

                    <div class="box">
                        <label>都道府県(県)</label><br>
                        <input type="text" name="pref" value="" class="p-region">
                    </div>

                    <div class="box">
                        <label>市区町村</label><br>
                        <input type="text" name="p-locality" class="p-locality" readonly /><br>
                    </div>

                    <div class="box">
                        <label>町名・番地</label><br>
                        <input type="text" class="p-street-address"><br>
                    </div>

                    <div class="box">
                        <label>建物名・部屋番号</label><br>
                        <input type="text" class="p-extended-address"><br>
                    </div>


                    <!-- 送信ボタン -->
                    <div class="submit">
                        <input type="submit" name="submit">
                    </div>
                </div>
            </form>
        </div>
    </section>
    
    <script src="../JavaScript.css/jquery-4.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>

    <script src="../yubinbango-gh-pages/yubinbango.js"></script>
    <script src="../JavaScript.css/form.js"></script>
